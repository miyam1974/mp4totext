name: Build Windows executable

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[cli,gui,dev,build]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Build portable app
        run: pyinstaller --noconfirm packaging/mp4totext.spec

      - uses: actions/upload-artifact@v6
        with:
          name: mp4totext-windows
          path: dist/mp4totext
